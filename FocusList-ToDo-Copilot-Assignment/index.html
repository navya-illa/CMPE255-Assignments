<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A focused, local-first task manager." />
  <title>FocusList — To-Do List</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">PERSONAL PRODUCTIVITY</p>
        <h1>FocusList</h1>
        <p class="subtitle">Clear your mind. Finish what matters.</p>
      </div>
      <button id="themeToggle" class="icon-button" type="button" aria-label="Toggle dark mode">◐</button>
    </header>

    <section class="summary-card" aria-label="Task summary">
      <div>
        <p class="summary-label">TODAY'S PROGRESS</p>
        <p id="progressText" class="progress-text">0 of 0 completed</p>
      </div>
      <div class="progress-ring" aria-hidden="true"><span id="progressPercent">0%</span></div>
    </section>

    <section class="composer" aria-label="Add a task">
      <form id="taskForm">
        <label class="sr-only" for="taskInput">Task title</label>
        <input id="taskInput" name="task" type="text" maxlength="120" placeholder="What needs to be done?" autocomplete="off" required />
        <label class="sr-only" for="priorityInput">Task priority</label>
        <select id="priorityInput" name="priority" aria-label="Task priority">
          <option value="low">Low priority</option>
          <option value="medium" selected>Medium priority</option>
          <option value="high">High priority</option>
        </select>
        <button class="primary-button" type="submit">Add task</button>
      </form>
    </section>

    <section class="toolbar" aria-label="Task controls">
      <div class="filters" role="group" aria-label="Filter tasks">
        <button class="filter-button active" data-filter="all" type="button">All</button>
        <button class="filter-button" data-filter="active" type="button">Active</button>
        <button class="filter-button" data-filter="completed" type="button">Completed</button>
      </div>
      <button id="clearCompleted" class="text-button" type="button">Clear completed</button>
    </section>

    <section id="taskList" class="task-list" aria-live="polite"></section>
    <p id="emptyState" class="empty-state">No tasks yet. Add one small step to get started.</p>

    <footer class="footer-note">Your tasks are saved locally in this browser.</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
